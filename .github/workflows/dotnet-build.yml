name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    paths-ignore:
      - '**/*.md'

env:
  JAVA_VERSION: '21'
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: Build .NET, Test and Analyse
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0 # Shallow clones disabled for a better relevancy of SC analysis

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'microsoft'

    - name: Cache SonarCloud packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.sonar
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Set Academies API Client credentials
      working-directory: ./src/Api/Dfe.Complete.Api
      env:
        API_DEV_URL: ${{ secrets.ACADEMIES_API_DEV_URL  }}
        API_DEV_KEY: ${{ secrets.ACADEMIES_API_DEV_KEY  }}
      run: |
        dotnet user-secrets set "AcademiesApiClient:BaseUrl" $API_DEV_URL
        dotnet user-secrets set "AcademiesApiClient:ApiKey" $API_DEV_KEY

    - name: Install SonarCloud scanners
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Install dotnet reportgenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Add nuget package source
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget add source --username USERNAME --password $GH_TOKEN --store-password-in-clear-text --name github "https://nuget.pkg.github.com/DFE-Digital/index.json"

    - name: Restore dependencies
      run: dotnet restore Dfe.Complete.sln

    - name: Build, Test and Analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet-sonarscanner begin /d:sonar.token=$SONAR_TOKEN /o:dfe-digital /k:DFE-Digital_complete-api /s:${{ github.workspace }}/SonarQube.Analysis.xml
        dotnet build Dfe.Complete.sln --no-restore
        dotnet test Dfe.Complete.sln --no-build --verbosity normal --collect:"XPlat Code Coverage"
        reportgenerator -reports:"./**/coverage.cobertura.xml" -targetdir:./src/CoverageReport -reporttypes:SonarQube
        dotnet-sonarscanner end /d:sonar.token=$SONAR_TOKEN
